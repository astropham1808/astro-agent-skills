name: Verify skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    name: contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Report the shell under test
        shell: bash
        run: bash --version | head -1
      - name: Run hermetic skill contract tests
        run: python tests/test_skill_contracts.py
      - name: Run the suite against the system Bash 3.2
        if: runner.os == 'macOS'
        env:
          ASTRO_BASH: /bin/bash
        run: |
          /bin/bash --version | head -1
          python tests/test_skill_contracts.py

  # Windows support means WSL. This job only proves the repository itself stays
  # usable from a native Windows checkout: line endings resolve to LF, the
  # manifests parse, and every script is syntactically valid to Git Bash.
  # The shell behavior tests skip themselves on nt.
  windows-checkout:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reject CRLF in the checkout
        shell: bash
        run: |
          if git ls-files --eol | grep -E 'w/crlf|w/mixed'; then
            echo "a Windows checkout produced CRLF working-tree files" >&2
            exit 1
          fi
      - name: Run static contract tests
        run: python tests/test_skill_contracts.py

  whitespace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check patch whitespace
        shell: bash
        env:
          PR_BASE_SHA: "${{ github.event.pull_request.base.sha }}"
          PUSH_BASE_SHA: "${{ github.event.before }}"
        run: |
          base="$PR_BASE_SHA"
          [ -n "$base" ] || base="$PUSH_BASE_SHA"
          if git cat-file -e "$base^{commit}" 2>/dev/null; then
            git diff --check "$base"...HEAD
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git show --check --format= HEAD
          fi
